<!DOCTYPE html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width">

    <meta name="theme-color" content="#1b5e20">

    <link rel="icon" type="image/png" href="icons/favicon-128x128.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
    <link rel="mask-icon" href="icons/safari-pinned-tab.svg" color="#1b5e20">

    <!-- iOS: sin estos <link>, "Agregar a inicio" usa una captura de pantalla
         en vez del icono de la app. Van sobre fondo blanco a propósito: iOS
         no respeta el canal alfa y pintaría de negro lo transparente. -->
    <link rel="apple-touch-icon" sizes="120x120" href="icons/apple-icon-120x120.png">
    <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-icon-152x152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-icon-167x167.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-icon-180x180.png">
    <meta name="apple-mobile-web-app-title" content="YASTA">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
